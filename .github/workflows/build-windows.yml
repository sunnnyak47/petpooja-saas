name: Windows Installer Build

on:
  push:
    tags:
      - 'v*.*.*'         # Trigger on version tags e.g. v2.0.3
  workflow_dispatch:      # Allow manual trigger from GitHub UI
    inputs:
      version:
        description: 'Build version (e.g. 2.0.4)'
        required: false
        default: 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows NSIS Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build
        env:
          # API base MUST include the /api prefix — backend mounts routes under /api
          # (POST /api/auth/login). Without it every call 404s ("Route ... not found").
          # Matches auto-release.yml + frontend/.env.local. Socket URL stays bare
          # (socket.io connects to the origin root, not /api).
          VITE_API_URL: 'https://petpooja-saas.onrender.com/api'
          VITE_SOCKET_URL: 'https://petpooja-saas.onrender.com'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Sync frontend dist into desktop
        working-directory: desktop
        run: npm run sync-frontend

      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win
        env:
          # Unsigned build. Do NOT add empty CSC_LINK/CSC_KEY_PASSWORD here — GitHub
          # defines the env key even when the secret is unset, and electron-builder
          # treats an empty-but-defined CSC_LINK as a file path and aborts
          # ("Env WIN_CSC_LINK is not correct, cannot resolve"). To enable signing,
          # add a separate build step guarded by `if: secrets.WIN_CERTIFICATE_PFX`.
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        working-directory: desktop
        shell: bash
        run: find dist -name "*.exe" -o -name "*.msi" 2>/dev/null | head -10 || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.msi
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
